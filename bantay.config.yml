# Bantay configuration
# Edit this file to customize invariant checking

source:
  include:
    - src/**/*
  exclude:
    - node_modules/**
    - dist/**
    - .next/**
    - build/**

# Decision oracle for `bantay check --diff` and `bantay gate` (needs TYPESAFE_API_KEY)
decision:
  provider: jev
  model: jev-latest
  threshold: 0.8

name: Omnibox Android

on:
  push:
    paths:
      - "omnibox-launcher/**"
      - ".github/workflows/omnibox-android.yml"
  pull_request:
    paths:
      - "omnibox-launcher/**"
      - ".github/workflows/omnibox-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omnibox-launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and APKs
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: omnibox-apks
          path: omnibox-launcher/app/build/outputs/apk/**/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omnibox-reports
          path: |
            omnibox-launcher/app/build/reports/
            omnibox-launcher/app/build/test-results/
